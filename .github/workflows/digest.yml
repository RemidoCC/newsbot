name: Dagelijkse digest

# 05:00 UTC = 07:00 in de zomer, 06:00 in de winter. GitHub kent geen
# tijdzones in cron; twee crons met een maandfilter zou het oplossen maar dat
# is meer onderhoud dan het waard is voor een uur verschil.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      nieuwe_digest: ${{ steps.controle.outputs.nieuw }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      # --- Ophalen en zeven (geen LLM) ---------------------------------

      - name: Bronnen ophalen
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/collect.py

      - name: Ontdubbelen en batches maken
        run: python scripts/dedupe.py

      # --- Verrijken -----------------------------------------------------
      # Alles hierna is continue-on-error. Valt het om, dan blijft de vorige
      # digest gewoon staan en publiceren we die opnieuw; er gaat dan geen
      # melding uit. Een dag zonder nieuwe digest is vervelend, een kapotte
      # site is erger.

      - name: Claude Code installeren
        id: claude_installeren
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      # Losse rooktest vóór de echte batches. Faalt claude -p, dan wil je weten
      # of het aan de authenticatie, de CLI of de prompt ligt — en dat zie je
      # niet als de uitvoer in een bestand verdwijnt dat later wordt gewist.
      - name: Claude Code controleren
        id: rooktest
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "versie: $(claude --version 2>&1 || echo onbekend)"

          # "401 Invalid bearer token" zegt niet óf het token fout is of alleen
          # verkeerd overgenomen. De vorm zegt dat wel. GitHub toont een geheim
          # als ***, dus ook een half gekopieerd token ziet er goed uit in de
          # logs; lengte en voorvoegsel verraden het wel. Het token zelf wordt
          # nergens afgedrukt.
          t="${CLAUDE_CODE_OAUTH_TOKEN}"
          echo "token: ${#t} tekens"
          case "$t" in
            sk-ant-oat*) echo "token: begint met sk-ant-oat, dat is de juiste soort" ;;
            sk-ant-api*) echo "::warning::token is een API-sleutel (sk-ant-api...), geen OAuth-token" ;;
            sk-ant-*)    echo "::warning::token begint met sk-ant- maar niet met sk-ant-oat" ;;
            *)           echo "::warning::token begint niet met sk-ant-, waarschijnlijk het verkeerde veld gekopieerd" ;;
          esac
          kaal=$(printf '%s' "$t" | tr -d '[:space:]')
          if [ "${#kaal}" -ne "${#t}" ]; then
            echo "::warning::er zit witruimte in het token ($(( ${#t} - ${#kaal} )) tekens); opnieuw plakken zonder spatie of regeleinde"
          fi

          # --debug laat zien welk verzoek de CLI doet en wat er terugkomt; dat
          # scheidt een fout token van een fout in de aanroep.
          echo "--- proefaanroep ---"
          claude -p 'Antwoord met uitsluitend: OK' --output-format text --debug \
            > /tmp/a.txt 2>/tmp/a.err || true
          echo "stdout=[$(head -c 200 /tmp/a.txt)]"
          echo "stderr:"
          head -c 2000 /tmp/a.err || true

      - name: Batches verrijken
        id: verrijken
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -u
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN ontbreekt, verrijken overgeslagen."
            exit 1
          fi
          shopt -s nullglob
          for batch in data/batches/batch_*.json; do
            nummer=$(basename "$batch" .json | sed 's/batch_//')
            uit="data/enriched_${nummer}.json"

            # De batch gaat via stdin, niet via een argument: veertig items van
            # 1500 tekens is ruim 60 KB en dat loopt stuk op argv-limieten en
            # shell-quoting.
            { cat scripts/enrich_prompt.md; echo; cat "$batch"; } \
              | claude -p --output-format text > "$uit" 2>"$uit.err" || true

            if ! python scripts/validate.py --batch "$uit" --check-only >/dev/null 2>&1; then
              echo "Batch ${nummer} kwam ongeldig terug, één keer opnieuw."
              echo "  stdout: [$(head -c 300 "$uit")]"
              echo "  stderr: [$(head -c 300 "$uit.err")]"
              { echo "Je vorige antwoord was geen geldige JSON-array."; \
                echo "Antwoord nu met uitsluitend een JSON-array: geen inleiding, geen markdown-fences."; \
                echo; cat scripts/enrich_prompt.md; echo; cat "$batch"; } \
                | claude -p --output-format text > "$uit" 2>"$uit.err" || true

              if ! python scripts/validate.py --batch "$uit" --check-only >/dev/null 2>&1; then
                echo "::warning::Batch ${nummer} blijft ongeldig, wordt overgeslagen."
                echo "  stdout: [$(head -c 300 "$uit")]"
                echo "  stderr: [$(head -c 300 "$uit.err")]"
                rm -f "$uit"
              fi
            fi
          done

      - name: Valideren en digest samenstellen
        id: valideren
        continue-on-error: true
        run: python scripts/validate.py

      - name: Is er een digest van vandaag?
        id: controle
        run: |
          vandaag=$(date -u +%Y-%m-%d)
          if [ -s "data/digest/${vandaag}.json" ] \
             && [ "$(python -c "import json;print(len(json.load(open('data/digest/${vandaag}.json'))['items']))")" -gt 0 ]; then
            echo "nieuw=true" >> "$GITHUB_OUTPUT"
          else
            echo "nieuw=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Geen nieuwe digest; de vorige blijft staan en er gaat geen melding uit."
          fi

      # --- Publiceren -----------------------------------------------------
      # build_site.py pakt altijd de nieuwste digest die er is. Is die van
      # gisteren, dan wordt gisteren opnieuw gepubliceerd — precies de bedoeling.

      - name: Site bouwen
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Supabase wakker houden
        continue-on-error: true
        run: |
          # Gratis projecten pauzeren na zeven dagen zonder verkeer. Eén
          # verzoek per dag voorkomt dat je na een vakantie moet ontdooien.
          url=$(grep -o "supabaseUrl:[^,]*" site/config.js | cut -d"'" -f2)
          key=$(grep -o "supabaseKey:[^,]*" site/config.js | cut -d"'" -f2)
          if [ -n "$url" ] && [ -n "$key" ]; then
            curl -sS -o /dev/null -m 20 -H "apikey: $key" "$url/rest/v1/sources?select=id&limit=1" || true
          fi

      - name: Data terugcommitten
        run: |
          git config user.name  "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          rm -f data/enriched_*.json data/enriched_*.json.err

          # dedupe.py werkt seen.json meteen bij en rekent erop dat git de
          # transactiegrens is: klapt de run, dan blijft de oude versie staan en
          # zijn de items morgen weer kandidaat. Maar de stappen na dedupe zijn
          # continue-on-error, dus committen we ook na een mislukking — en dan
          # verdwijnt het nieuws van vandaag ongelezen in het geheugen. Zonder
          # digest is er niets getoond, dus mag ook niets als gezien gelden.
          if [ "${{ steps.controle.outputs.nieuw }}" != "true" ]; then
            if git ls-files --error-unmatch data/seen.json >/dev/null 2>&1; then
              git checkout -- data/seen.json
            else
              rm -f data/seen.json
            fi
            echo "Geen digest: seen.json teruggedraaid, de items blijven kandidaat."
          fi

          git add data/ sources/
          if git diff --cached --quiet; then
            echo "Niets veranderd."
          else
            git commit -m "Digest $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
          fi

  deploy:
    needs: digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - id: pages
        uses: actions/deploy-pages@v4

      # Pas melden als de site echt live staat. Andersom krijg je een melding
      # voor een digest die je nog niet kunt openen.
      - uses: actions/checkout@v4
        if: needs.digest.outputs.nieuwe_digest == 'true'
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        if: needs.digest.outputs.nieuwe_digest == 'true'
        with:
          python-version: "3.12"

      - name: Melding versturen
        if: needs.digest.outputs.nieuwe_digest == 'true'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
        run: |
          # De volle requirements: send_push.py leunt via collect.py ook op
          # feedparser, bs4 en ruamel.
          pip install --quiet -r requirements.txt
          python scripts/send_push.py

  # Zonder deze job slagen de meeste storingen stil: geen token, alle batches
  # ongeldig, Supabase weg — de run wordt groen en publiceert een oude digest.
  # Je merkt het dan pas als je opvalt dat het nieuws niet vers is. Deze job
  # loopt als laatste en faalt met opzet, zodat GitHub je een mail stuurt.
  # Hij blokkeert de deploy niet: die is op dit punt al gebeurd.
  alarm:
    needs: [digest, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Stille storing melden
        run: |
          if [ "${{ needs.digest.result }}" != "success" ]; then
            echo "::error::De digest-job zelf is gefaald. Zie de logs hierboven."
            exit 1
          fi
          if [ "${{ needs.digest.outputs.nieuwe_digest }}" != "true" ]; then
            echo "::error::De run is geslaagd maar leverde geen nieuwe digest op."
            echo "Meest waarschijnlijk: CLAUDE_CODE_OAUTH_TOKEN ontbreekt of is"
            echo "verlopen, of alle batches kwamen ongeldig terug. De site toont"
            echo "nu de vorige digest en er is geen melding verstuurd."
            exit 1
          fi
          echo "Nieuwe digest gepubliceerd."
