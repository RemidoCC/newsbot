# Internationale AI-bronnen.
#
# `verified` en `verified_at` worden niet met de hand gezet. Ze komen uit:
#     python scripts/collect.py --verify --apply
# die draait in .github/workflows/verify_sources.yml. Zolang een bron
# `verified: false` heeft is de URL een kandidaat, geen bewezen feed.
#
# Per bron:
#   enabled        bron doet mee aan de dagelijkse run
#   type           rss | reddit | hn | newsletter | x
#   priority       1 = hoogste. Bepaalt mee wie de cap van 120 items haalt.
#   url            de feed zelf
#   fallback_urls  alternatieven die --verify probeert als `url` faalt
#   homepage       voor feed-autodiscovery als alles faalt (<link rel=alternate>)
#   max_items      cap per bron per run
#   include_keywords  optioneel: alleen items die een van deze woorden bevatten

channel: ai
region: int
language: en

sources:
  # Uitgezet 2026-08-11: 403 op alle paden en op de homepage: Cloudflare weigert de runner.
  # Weer aanzetten kan via /beheer of door hier true te zetten.
  - name: The Batch (DeepLearning.AI)
    enabled: false
    type: rss
    priority: 1
    url: https://www.deeplearning.ai/the-batch/rss.xml
    fallback_urls:
      - https://www.deeplearning.ai/the-batch/feed/
      - https://www.deeplearning.ai/feed/
    homepage: https://www.deeplearning.ai/the-batch/
    max_items: 15
    verified: false
    verified_at: null

  - name: Import AI
    enabled: true
    type: rss
    priority: 1
    url: https://importai.substack.com/feed
    fallback_urls:
      - https://jack-clark.net/feed/
    homepage: https://importai.substack.com/
    max_items: 15
    verified: false
    verified_at: null

  - name: Ars Technica AI
    enabled: true
    type: rss
    priority: 2
    url: https://arstechnica.com/ai/feed/
    fallback_urls:
      - https://feeds.arstechnica.com/arstechnica/index
    homepage: https://arstechnica.com/ai/
    max_items: 25
    verified: false
    verified_at: null

  - name: MIT Technology Review — AI
    enabled: true
    type: rss
    priority: 1
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed/
    fallback_urls:
      - https://www.technologyreview.com/feed/
    homepage: https://www.technologyreview.com/topic/artificial-intelligence/
    max_items: 25
    verified: false
    verified_at: null

  - name: VentureBeat AI
    enabled: true
    type: rss
    priority: 3
    url: https://venturebeat.com/category/ai/feed/
    fallback_urls:
      - https://feeds.feedburner.com/venturebeat/SZYF
    homepage: https://venturebeat.com/category/ai/
    max_items: 25
    verified: false
    verified_at: null

  - name: Simon Willison
    enabled: true
    type: rss
    priority: 1
    url: https://simonwillison.net/atom/everything/
    fallback_urls:
      - https://simonwillison.net/atom/entries/
    homepage: https://simonwillison.net/
    max_items: 25
    verified: false
    verified_at: null

  # Anthropic publiceert geen eigen RSS: alle drie de gangbare paden gaven 404
  # vanaf de Actions-runner. Wat overblijft zijn community-mirrors (RSSHub), en
  # dat is dezelfde soort broze afhankelijkheid als de X-bridge. Daarom uit.
  # Anthropic-nieuws komt in de praktijk toch binnen via HN, Ars en Simon Willison.
  # Wil je het toch: zet enabled op true en laat --verify de mirror testen.
  - name: Anthropic
    enabled: false
    type: rss
    priority: 1
    url: https://rsshub.bestblogs.dev/anthropic/news
    fallback_urls: []
    homepage: https://www.anthropic.com/news
    max_items: 15
    verified: false
    verified_at: null

  - name: Google DeepMind
    enabled: true
    type: rss
    priority: 1
    url: https://deepmind.google/blog/rss.xml
    fallback_urls:
      - https://deepmind.google/discover/blog/rss.xml
    homepage: https://deepmind.google/discover/blog/
    max_items: 15
    verified: false
    verified_at: null

  - name: OpenAI
    enabled: true
    type: rss
    priority: 1
    url: https://openai.com/news/rss.xml
    fallback_urls:
      - https://openai.com/blog/rss.xml
    homepage: https://openai.com/news/
    max_items: 15
    verified: false
    verified_at: null

  # --- Nieuwsbrieven zonder eigen RSS -------------------------------------
  # Deze twee hebben geen publieke feed. Route loopt via Kill-the-Newsletter:
  # je maakt daar per nieuwsbrief een inbox aan, meldt je met dat mailadres
  # aan, en plakt de bijbehorende Atom-URL hieronder. Zie README stap 5.
  # Tot die tijd staan ze uit; een lege url wordt door --verify overgeslagen.

  - name: TLDR AI
    enabled: false
    type: newsletter
    priority: 2
    url: ""
    homepage: https://tldr.tech/ai
    max_items: 10
    verified: false
    verified_at: null

  - name: The Rundown AI
    enabled: false
    type: newsletter
    priority: 2
    url: ""
    homepage: https://www.therundown.ai/
    max_items: 10
    verified: false
    verified_at: null

  # --- Aggregators --------------------------------------------------------

  - name: Hacker News
    enabled: true
    type: hn
    priority: 2
    url: https://hn.algolia.com/api/v1/search_by_date
    query: AI
    min_points: 50
    max_items: 30
    homepage: https://news.ycombinator.com/
    verified: false
    verified_at: null

  # Reddit's onauthenticated .json is sinds mei 2026 dicht (403, zeker vanaf
  # datacenter-IP's zoals Actions-runners). Deze bronnen lopen daarom via de
  # officiele OAuth-API met REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET.
  # Ontbreken die secrets, dan slaat collect.py ze over en logt dat. Zie README stap 4.

  - name: r/MachineLearning
    enabled: true
    type: reddit
    priority: 3
    subreddit: MachineLearning
    listing: top
    timeframe: day
    min_score: 25
    max_items: 25
    verified: false
    verified_at: null

  - name: r/LocalLLaMA
    enabled: true
    type: reddit
    priority: 3
    subreddit: LocalLLaMA
    listing: top
    timeframe: day
    min_score: 50
    max_items: 25
    verified: false
    verified_at: null

  - name: r/artificial
    enabled: true
    type: reddit
    priority: 4
    subreddit: artificial
    listing: top
    timeframe: day
    min_score: 50
    max_items: 25
    verified: false
    verified_at: null

  - name: r/singularity
    enabled: true
    type: reddit
    priority: 4
    subreddit: singularity
    listing: top
    timeframe: day
    min_score: 100
    max_items: 25
    verified: false
    verified_at: null
