    max_items: 25
    verified: false
    verified_at: null

  - name: Digisterker
    enabled: true
    type: rss
    priority: 2
    url: https://www.digisterker.nl/feed
    fallback_urls:
      - https://www.digisterker.nl/rss
      - https://digisterker.nl/feed/
    homepage: https://www.digisterker.nl/nieuws
    max_items: 25
    verified: false
    verified_at: null

  - name: SPN (Samenwerkende POI's Nederland)
