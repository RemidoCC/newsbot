# Dit zijn laagfrequente bronnen. Een aantal publiceert een paar keer per maand,
# niet per dag. Daarom staat het leeftijdsvenster voor het kanaal `bieb` in
# dedupe.py op 7 dagen in plaats van 48 uur — anders is deze tab meestal leeg.

