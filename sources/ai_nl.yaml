# Nederlandse AI- en techbronnen.
# Zie sources/ai_int.yaml voor de betekenis van de velden.
#
# Let op: dit zijn brede techfeeds, geen AI-feeds. Daarom filteren de meeste
# hier op `include_keywords`. Het filter matcht op hele woorden, dus "ai" raakt
# wel "AI-verordening" maar niet "email" of "detail".

channel: ai
region: nl
language: nl

sources:
  # De FeedBurner-feed parseert prima maar is bevroren sinds april 2025.
  # Daarom staat hij achteraan: --verify kiest sinds de fix de verste kandidaat.
  - name: Tweakers
    enabled: true
    type: rss
    priority: 2
    url: https://tweakers.net/feeds/nieuws.xml
    fallback_urls:
      - https://tweakers.net/feeds/mixed.xml
      - https://tweakers.net/nieuws/rss/
      - https://feeds.feedburner.com/tweakers/mixed
    homepage: https://tweakers.net/
    max_items: 40
    include_keywords:
      - ai
      - a.i.
      - kunstmatige intelligentie
      - llm
      - chatbot
      - taalmodel
      - openai
      - anthropic
      - deepmind
      - copilot
      - algoritme
    verified: false
    verified_at: null

  - name: NOS Tech
    enabled: true
    type: rss
    priority: 2
    url: https://feeds.nos.nl/nosnieuwstech
    fallback_urls:
      - https://feeds.nos.nl/nostechnieuws
    homepage: https://nos.nl/nieuws/tech
    max_items: 30
    include_keywords:
      - ai
      - kunstmatige intelligentie
      - llm
      - chatbot
      - taalmodel
      - algoritme
      - openai
      - anthropic
    verified: false
