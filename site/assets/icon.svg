<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="newsbot">
  <!-- Een opengeslagen krant in de kleuren van de app: gebrand oranje als
       ondergrond zodat hij opvalt tussen andere iconen, papier in dezelfde
       zandtint als de site. De vormen zijn grof gehouden — op 32 pixels
       moeten de kop, de foto en de tekstblokken nog van elkaar te
       onderscheiden zijn. -->
  <rect width="512" height="512" rx="112" fill="#a35418"/>

  <!-- Tweede pagina eronder, geeft de stapel diepte -->
  <rect x="126" y="156" width="284" height="236" rx="12" fill="#e5d3ba"/>

  <!-- Voorpagina -->
  <rect x="102" y="132" width="284" height="236" rx="12" fill="#fcfaf6"/>

  <!-- Kop en scheidingslijn -->
  <rect x="126" y="158" width="236" height="22" rx="6" fill="#1f1a14"/>
  <rect x="126" y="194" width="236" height="5" rx="2.5" fill="#1f1a14" opacity="0.28"/>

  <!-- Foto -->
  <rect x="126" y="216" width="92" height="72" rx="7" fill="#a35418" opacity="0.85"/>

  <!-- Kolomtekst naast de foto -->
  <rect x="234" y="220" width="128" height="11" rx="5.5" fill="#1f1a14" opacity="0.42"/>
  <rect x="234" y="245" width="128" height="11" rx="5.5" fill="#1f1a14" opacity="0.42"/>
  <rect x="234" y="270" width="96" height="11" rx="5.5" fill="#1f1a14" opacity="0.42"/>

  <!-- Tekst over de volle breedte -->
  <rect x="126" y="310" width="236" height="11" rx="5.5" fill="#1f1a14" opacity="0.42"/>
  <rect x="126" y="335" width="180" height="11" rx="5.5" fill="#1f1a14" opacity="0.42"/>
</svg>
